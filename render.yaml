services:
  - type: web
    name: cakranexa
    # Docker: image menyertakan ffmpeg & poppler-utils untuk pemrosesan e-book/audiobook (lihat Dockerfile).
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Starter: selalu aktif (job pemrosesan & deteksi anomali per jam berjalan di proses server).
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MIDTRANS_CLIENT_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DIGITAL_ASSETS_BUCKET
        value: digital-assets
      # Flag fitur digital: "false" = tertutup untuk umum, hanya DIGITAL_BETA_EMAILS yang bisa memakai.
      - key: DIGITAL_ENABLED
        value: "false"
      - key: DIGITAL_BETA_EMAILS
        sync: false
